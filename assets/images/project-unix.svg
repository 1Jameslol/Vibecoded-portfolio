<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#07100d"/>
  <rect x="42" y="42" width="816" height="476" rx="8" fill="#0b1713" stroke="#1d4a35" stroke-width="3"/>
  <rect x="42" y="42" width="816" height="46" rx="8" fill="#10221a"/>
  <circle cx="72" cy="65" r="7" fill="#8cffb5"/><circle cx="98" cy="65" r="7" fill="#4d9d70"/><circle cx="124" cy="65" r="7" fill="#1d4a35"/>
  <text x="155" y="71" fill="#79a68a" font-family="monospace" font-size="18">unix@systems-lab:~</text>
  <text x="82" y="140" fill="#8cffb5" font-family="monospace" font-size="24">$ systemctl status infrastructure</text>
  <text x="82" y="182" fill="#d8f7df" font-family="monospace" font-size="20">active (running)  dns  ldap  nginx  docker</text>
  <text x="82" y="230" fill="#8cffb5" font-family="monospace" font-size="24">$ kubectl get nodes</text>
  <text x="82" y="272" fill="#79a68a" font-family="monospace" font-size="20">NAME          STATUS    ROLE</text>
  <text x="82" y="308" fill="#d8f7df" font-family="monospace" font-size="20">control-01    Ready     control-plane</text>
  <text x="82" y="344" fill="#d8f7df" font-family="monospace" font-size="20">worker-01     Ready     worker</text>
  <text x="82" y="398" fill="#8cffb5" font-family="monospace" font-size="24">$ uptime</text>
  <text x="82" y="440" fill="#d8f7df" font-family="monospace" font-size="20">services stable | failover ready</text>
</svg>
